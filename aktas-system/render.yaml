services:
  - type: web
    name: aktas-accounting-system
    runtime: docker
    region: frankfurt
    plan: starter
    
    # Environment variables for production
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: 'false'
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stack
      - key: APP_NAME
        value: Aktaš
      - key: APP_LOCALE
        value: ar
      - key: APP_FALLBACK_LOCALE
        value: en
        
      # Database (PostgreSQL)
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: aktas-postgres-db
          property: connectionString

    # Pre-deploy tasks
    preDeployCommand: php artisan migrate --force
    
    # Health check endpoint
    healthCheckPath: /login

  # PostgreSQL 18 Database Service
  - type: postgresql
    name: aktas-postgres-db
    region: frankfurt
    plan: starter
    ipAllowList: [] # Allow connections from the web service
    
    # Database configuration
    databaseName: aktas_system
    user: aktas_user
    postgresMajorVersion: '18'
