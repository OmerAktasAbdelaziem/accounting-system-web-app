services:
  - type: web
    name: aktas-accounting-system
    runtime: docker
    region: frankfurt
    plan: starter

    # Environment variables for production
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: 'false'
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stack
      - key: APP_NAME
        value: Aktaš
      - key: APP_LOCALE
        value: ar
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: SEED_TOKEN
        value: run-seed-2026

      # Database (PostgreSQL)
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: aktas-postgres-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: aktas-postgres-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: aktas-postgres-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: aktas-postgres-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: aktas-postgres-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: aktas-postgres-db
          property: password

    # Pre-deploy tasks
    preDeployCommand: /usr/local/bin/php artisan migrate --force --seed
    # Ensure the container starts by running the entrypoint (runs migrations then Apache)
    startCommand: sh /var/www/html/entrypoint.sh

    # Health check endpoint
    healthCheckPath: /login

  # PostgreSQL 18 Database Service
  - type: postgresql
    name: aktas-postgres-db
    region: frankfurt
    plan: starter
    ipAllowList: [] # Allow connections from the web service

    # Database configuration
    databaseName: aktas_system
    user: aktas_user
    postgresMajorVersion: '18'